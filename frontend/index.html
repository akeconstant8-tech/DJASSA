<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <title>Djassa Market</title>
    <meta name="description" content="Marketplace e-commerce complète avec catalogue produits en XOF, parcours d'achat client et espace vendeur sécurisé pour la gestion des stocks." />
    <meta property="og:title" content="Djassa Market" />
    <meta property="og:description" content="Marketplace e-commerce complète avec catalogue produits en XOF, parcours d'achat client et espace vendeur sécurisé pour la gestion des stocks." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://lh3.googleusercontent.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Police d'icônes : tant qu'elle n'est pas prête, les icônes restent invisibles (sinon leur nom
      // s'affiche en texte, ex. « shopping_bag »). Filet de sécurité : affichage forcé après 4 s.
      (function () {
        var done = false;
        function ready() {
          if (done) return;
          done = true;
          document.documentElement.classList.add('icons-ready');
        }
        window.__iconsCssLoaded = function () {
          if (document.fonts && document.fonts.load) {
            document.fonts.load('24px "Material Symbols Outlined"').then(ready, ready);
          } else ready();
        };
        setTimeout(ready, 4000);
      })();
    </script>
    <!-- Sous-ensemble limité aux icônes utilisées (~12 Ko au lieu de ~3,9 Mo).
         Liste vérifiée avant chaque build par scripts/icons.mjs (npm run icons -- --print pour la régénérer). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400..500,0..1,0&icon_names=account_balance_wallet,add,add_circle,arrow_back,arrow_forward,check,check_circle,chevron_right,close,credit_card,delete,expand_more,grid_view,image_not_supported,inventory_2,local_mall,local_shipping,lock,login,logout,notification_important,payments,print,remove_shopping_cart,search,shelves,shopping_bag,star,storefront,touch_app,tune,verified,verified_user,view_list&display=block"
      rel="stylesheet"
      onload="__iconsCssLoaded()"
      onerror="__iconsCssLoaded()"
    />
    <style>
      /* Squelette affiché avant le chargement du JavaScript (remplacé par React au premier rendu).
         CSS autonome : ne dépend pas de la feuille de style de l'application. */
      html,
      body {
        margin: 0;
        background: #fffaf5;
        color: #0f172a;
      }
      .shell-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      /* Hauteurs calquées sur l'en-tête réel : bandeau sur deux lignes sur mobile, recherche sous l'en-tête < 1280px. */
      .shell-promo {
        height: 46px;
        background: linear-gradient(135deg, #09090b, #18181b 50%, #000);
      }
      .shell-search {
        height: 38px;
        margin: 0 16px 12px;
        border-radius: 999px;
      }
      .shell-bar {
        background: #fff;
        border-bottom: 1px solid rgba(254, 215, 170, 0.6);
      }
      .shell-header,
      .shell-main {
        box-sizing: border-box;
        max-width: 80rem;
        margin: 0 auto;
        padding: 0 16px;
      }
      .shell-header {
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .shell-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .shell-main {
        padding-top: 24px;
        padding-bottom: 24px;
      }
      .shell-hero {
        background: linear-gradient(135deg, #09090b, #18181b 50%, #000);
        border-radius: 24px;
        padding: 24px;
        margin-bottom: 32px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .shell-grid {
        display: grid;
        gap: 24px;
        grid-template-columns: 1fr;
      }
      .shell-card {
        background: #fff;
        border: 1px solid rgba(254, 215, 170, 0.6);
        border-radius: 24px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .sk {
        position: relative;
        overflow: hidden;
        background: #f3e8dc;
        border-radius: 12px;
      }
      .sk::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.65), transparent);
        animation: shell-shine 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .sk-dark {
        background: #27272a;
      }
      .sk-dark::after {
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
      }
      @keyframes shell-shine {
        to {
          transform: translateX(100%);
        }
      }
      @media (min-width: 560px) {
        .shell-promo {
          height: 26px;
        }
      }
      @media (min-width: 640px) {
        .shell-header,
        .shell-main {
          padding-left: 24px;
          padding-right: 24px;
        }
        .shell-search {
          margin-left: 24px;
          margin-right: 24px;
        }
        .shell-main {
          padding-top: 32px;
        }
        .shell-hero {
          padding: 32px;
        }
        .shell-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (min-width: 1280px) {
        .shell-grid {
          grid-template-columns: repeat(3, 1fr);
        }
        .shell-search {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sk::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="root">
      <div role="status" aria-live="polite" aria-busy="true">
        <span class="shell-sr">Chargement de Djassa Market…</span>
        <div class="shell-promo"></div>
        <div class="shell-bar">
          <div class="shell-header">
            <div class="shell-row">
              <div class="sk" style="width: 44px; height: 44px; border-radius: 16px"></div>
              <div class="sk" style="width: 120px; height: 18px"></div>
            </div>
            <div class="shell-row">
              <div class="sk" style="width: 72px; height: 40px; border-radius: 999px"></div>
              <div class="sk" style="width: 40px; height: 40px; border-radius: 999px"></div>
            </div>
          </div>
          <div class="sk shell-search"></div>
        </div>
        <div class="shell-main">
          <div class="shell-hero">
            <div class="sk sk-dark" style="width: 260px; max-width: 80%; height: 24px; border-radius: 999px"></div>
            <div class="sk sk-dark" style="width: 340px; max-width: 90%; height: 36px"></div>
            <div class="sk sk-dark" style="width: 460px; max-width: 100%; height: 14px"></div>
            <div class="sk sk-dark" style="width: 280px; max-width: 75%; height: 14px"></div>
          </div>
          <div class="shell-grid">
            <div class="shell-card">
              <div class="sk" style="height: 208px; border-radius: 16px"></div>
              <div class="sk" style="width: 70%; height: 16px"></div>
              <div class="sk" style="width: 45%; height: 12px"></div>
              <div class="sk" style="width: 35%; height: 22px"></div>
              <div class="sk" style="height: 40px; border-radius: 16px"></div>
            </div>
            <div class="shell-card">
              <div class="sk" style="height: 208px; border-radius: 16px"></div>
              <div class="sk" style="width: 60%; height: 16px"></div>
              <div class="sk" style="width: 50%; height: 12px"></div>
              <div class="sk" style="width: 30%; height: 22px"></div>
              <div class="sk" style="height: 40px; border-radius: 16px"></div>
            </div>
            <div class="shell-card">
              <div class="sk" style="height: 208px; border-radius: 16px"></div>
              <div class="sk" style="width: 65%; height: 16px"></div>
              <div class="sk" style="width: 40%; height: 12px"></div>
              <div class="sk" style="width: 38%; height: 22px"></div>
              <div class="sk" style="height: 40px; border-radius: 16px"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
