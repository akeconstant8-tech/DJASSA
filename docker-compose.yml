version: '3.9'

services:
  # ── Base de données PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: djassa_postgres
    environment:
      POSTGRES_USER: djassa
      POSTGRES_PASSWORD: djassa_pass
      POSTGRES_DB: djassa_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U djassa -d djassa_db']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (cache + files BullMQ) ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: djassa_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # ── Serveur mail de développement ───────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog
    container_name: djassa_mail
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # Interface web
    logging:
      driver: none

  # ── Backend NestJS ───────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: djassa_api
    environment:
      DATABASE_URL: postgresql://djassa:djassa_pass@postgres:5432/djassa_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: djassa_secret_dev_min_32_chars_000000
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: http://localhost:3000
      PORT: 3001
      NODE_ENV: development
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run start:dev

  # ── Frontend React (dev) ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: djassa_frontend
    environment:
      VITE_API_URL: http://localhost:3001/api/v1
    ports:
      - '3000:3000'
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
